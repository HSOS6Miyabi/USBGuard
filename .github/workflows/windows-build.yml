name: Windows CI and Releases

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: usbguard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (${{ matrix.name }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: x86,   cmake_arch: Win32,  pe_machine: '014c', runnable: true, toolset: v141_xp }
          - { name: x64,   cmake_arch: x64,    pe_machine: '8664', runnable: true, toolset: v143 }
          - { name: ARM64, cmake_arch: ARM64,  pe_machine: 'aa64', runnable: false, toolset: v143 }
    steps:
      - uses: actions/checkout@v4
      - name: Install Windows XP platform toolset (x86 only)
        if: matrix.name == 'x86'
        timeout-minutes: 12
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $programFilesX86 = ${env:ProgramFiles(x86)}
          $vswhere = Join-Path $programFilesX86 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installPath = (& $vswhere -latest -products '*' -property installationPath | Select-Object -First 1).Trim()
          if (!$installPath) { throw 'Visual Studio 2022 installation not found' }
          $toolsetPath = Join-Path $installPath 'MSBuild\Microsoft\VC\v170\Platforms\Win32\PlatformToolsets\v141_xp'
          $legacyToolsetPath = Join-Path $installPath 'MSBuild\Microsoft\VC\v150\Platforms\Win32\PlatformToolsets\v141_xp'
          if (!(Test-Path $toolsetPath) -and !(Test-Path $legacyToolsetPath)) {
            $installer = Join-Path $programFilesX86 'Microsoft Visual Studio\Installer\vs_installer.exe'
            if (!(Test-Path $installer)) {
              $installer = Join-Path $programFilesX86 'Microsoft Visual Studio\Installer\setup.exe'
            }
            if (!(Test-Path $installer)) { throw "Visual Studio Installer not found: $installer" }
            $arguments = 'modify --installPath "' + $installPath +
              '" --add Microsoft.VisualStudio.Component.VC.v141.x86.x64' +
              ' --add Microsoft.VisualStudio.Component.WinXP --includeRecommended --quiet --norestart'
            $process = Start-Process -FilePath $installer -ArgumentList $arguments -PassThru
            try {
              Wait-Process -Id $process.Id -Timeout 630 -ErrorAction Stop
            } catch {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              throw "Windows XP toolset installation exceeded the CI time limit"
            }
            $process.Refresh()
            if ($process.ExitCode -notin @(0,3010)) {
              throw "Windows XP toolset installation failed (exit code $($process.ExitCode))"
            }
          }
          $xpComponent = & $vswhere -all -products '*' -requires Microsoft.VisualStudio.Component.WinXP -property installationPath
          Write-Host "Visual Studio instances reporting Windows XP component: $xpComponent"
          if (!(Test-Path $toolsetPath) -and !(Test-Path $legacyToolsetPath)) {
            Write-Host "Searching alternate installed v141_xp toolset locations"
            Get-ChildItem -LiteralPath (Join-Path $installPath 'MSBuild\Microsoft\VC') -Recurse -Directory -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -like 'v141*' } |
              Select-Object -First 20 -ExpandProperty FullName | ForEach-Object { Write-Host $_ }
            $logs = Get-ChildItem -Path $env:TEMP -Filter '*setup*log' -File -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending | Select-Object -First 2
            foreach ($log in $logs) {
              Write-Host "Visual Studio Installer log: $($log.Name)"
              Get-Content -LiteralPath $log.FullName -Tail 75 -ErrorAction SilentlyContinue
            }
            throw "Windows XP toolset remains unavailable: $toolsetPath"
          }
      - name: Configure MSVC
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A ${{ matrix.cmake_arch }} -T ${{ matrix.toolset }} -DBUILD_TESTING=ON
      - name: Build release executables and policy tests
        run: cmake --build build --config Release --parallel
      - name: Execute platform-neutral and source tests (x86 / x64)
        if: matrix.runnable
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Integration test MBR and GPT on disposable virtual disks
        if: matrix.name == 'x64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./tests/test_vhd.ps1 -Executable ./build/Release/storage_integration.exe -Style MBR
          & ./tests/test_vhd.ps1 -Executable ./build/Release/storage_integration.exe -Style GPT
      - name: Run source checks on host (ARM64 cross-build)
        if: ${{ !matrix.runnable }}
        run: python tests/inspect_source.py
      - name: Verify PE format, architecture, GUI subsystem and embedded resources
        shell: pwsh
        run: |
          python tests/inspect_pe.py "build/Release/USBGuardUI.exe" "${{ matrix.pe_machine }}"
          python tests/inspect_pe.py "build/Release/USBGuardMini.exe" "${{ matrix.pe_machine }}"
      - name: Package portable applications
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/Release/USBGuardUI.exe "dist/USBGuardUI-${{ matrix.name }}.exe"
          Copy-Item build/Release/USBGuardMini.exe "dist/USBGuardMini-${{ matrix.name }}.exe"
          Copy-Item README.md dist/README.md
          Compress-Archive -Path dist/README.md,dist/USBGuardUI-${{ matrix.name }}.exe,dist/USBGuardMini-${{ matrix.name }}.exe -DestinationPath "dist/USBGuard-${{ matrix.name }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: USBGuard-${{ matrix.name }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  linux:
    name: Linux build and test (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: x86_64, runner: ubuntu-22.04 }
          - { name: aarch64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK3 and virtual display build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgtk-3-dev xvfb xauth pkg-config
      - name: Install headless Wayland compositor (x86_64)
        if: matrix.name == 'x86_64'
        run: sudo apt-get install -y --no-install-recommends weston
      - name: Configure Linux CLI and Wayland/X11 GUI
        run: cmake -S . -B build-linux -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DUSBGUARD_LINUX_GUI=ON
      - name: Build Linux executables
        run: cmake --build build-linux --parallel 3
      - name: Run Linux unit tests, CLI checks, and Xvfb GUI smoke test
        run: ctest --test-dir build-linux --output-on-failure
      - name: Test All-In-One archive builder
        run: python3 -m unittest discover -s tests -p 'test_all_in_one.py'
      - name: Verify Linux GUI and CLI are built
        run: |
          test -x build-linux/linux/USBGuardLinux
          test -x build-linux/linux/USBGuardLinuxCLI
          build-linux/linux/USBGuardLinuxCLI --help
      - name: Test native Wayland GTK backend with headless Weston
        if: matrix.name == 'x86_64'
        shell: bash
        run: |
          set -euo pipefail
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          chmod 700 "$XDG_RUNTIME_DIR"
          export WAYLAND_DISPLAY=usbguard-ci
          export GDK_BACKEND=wayland
          unset DISPLAY || true
          weston --backend=headless-backend.so --socket="$WAYLAND_DISPLAY" --idle-time=0 --no-config --log="$RUNNER_TEMP/weston.log" &
          weston_pid=$!
          trap 'kill "$weston_pid" 2>/dev/null || true; rm -rf "$XDG_RUNTIME_DIR"' EXIT
          ready=0
          for i in $(seq 1 80); do
            if test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY"; then ready=1; break; fi
            if ! kill -0 "$weston_pid" 2>/dev/null; then break; fi
            sleep 0.15
          done
          if test "$ready" -ne 1; then cat "$RUNNER_TEMP/weston.log"; exit 1; fi
          timeout 20 build-linux/linux/USBGuardLinux --ui-self-test
      - name: Package Linux portable artifacts
        shell: bash
        run: |
          mkdir -p dist/USBGuard-Linux-${{ matrix.name }}
          install -m 755 build-linux/linux/USBGuardLinux dist/USBGuard-Linux-${{ matrix.name }}/USBGuardLinux
          install -m 755 build-linux/linux/USBGuardLinuxCLI dist/USBGuard-Linux-${{ matrix.name }}/USBGuardLinuxCLI
          cp linux/README.md dist/USBGuard-Linux-${{ matrix.name }}/README.md
          tar -C dist -czf dist/USBGuard-Linux-${{ matrix.name }}.tar.gz USBGuard-Linux-${{ matrix.name }}
          cp build-linux/linux/USBGuardLinux dist/USBGuardLinux-${{ matrix.name }}
          cp build-linux/linux/USBGuardLinuxCLI dist/USBGuardLinuxCLI-${{ matrix.name }}
          rm -rf dist/USBGuard-Linux-${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        with:
          name: USBGuard-Linux-${{ matrix.name }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish verified binaries
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    needs: [build, linux]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: USBGuard-*
          path: release-assets
          merge-multiple: true
      - name: Create and verify All-In-One archive
        run: |
          python3 -m unittest discover -s tests -p 'test_all_in_one.py'
          python3 scripts/package_all_in_one.py \
            release-assets release-assets/USBGuard-All-In-One.zip \
            README.md linux/README.md
      - name: Verify assets and calculate SHA-256 checksums
        id: info
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then tag="$GITHUB_REF_NAME"
          else tag="v1.1.${GITHUB_RUN_NUMBER}"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          test "$(find release-assets -maxdepth 1 -name '*.exe' -type f | wc -l)" -eq 6
          test "$(find release-assets -maxdepth 1 -name '*.zip' -type f | wc -l)" -eq 4
          test "$(find release-assets -maxdepth 1 -name '*.tar.gz' -type f | wc -l)" -eq 2
          test "$(find release-assets -maxdepth 1 -name 'USBGuardLinux*' -type f | wc -l)" -eq 4
          (
            cd release-assets
            mapfile -d '' -t assets < <(find . -maxdepth 1 -type f \( -name '*.exe' -o -name '*.zip' -o -name '*.tar.gz' -o -name 'USBGuardLinux*' \) -print0 | sort -z)
            test "${#assets[@]}" -eq 16
            for file in "${assets[@]}"; do sha256sum "${file#./}"; done
          ) > release-assets/SHA256SUMS.txt
      - name: Publish combined Windows and Linux release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -d '' -t assets < <(find release-assets -maxdepth 1 -type f \( -name '*.exe' -o -name '*.zip' -o -name '*.tar.gz' -o -name 'USBGuardLinux*' \) -print0 | sort -z)
          test "${#assets[@]}" -eq 16
          gh release create "${{ steps.info.outputs.tag }}" "${assets[@]}" release-assets/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --title "USBGuard ${{ steps.info.outputs.tag }}" \
            --notes "Windows (x86/x64/ARM64) and Linux (x86_64/aarch64) are available separately. USBGuard-All-In-One.zip contains all 10 executables and usage guides, organized by platform. Linux GTK3 supports X11 and Wayland; its read-only setting lasts until USB disconnection. SHA-256 checksums included." \
            --verify-tag=false
